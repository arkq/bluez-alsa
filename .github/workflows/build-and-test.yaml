name: Build and Test

on:
  push:
  pull_request:
    branches: [ master ]

env:
  MAKEFLAGS: -j8
  LIBASOUND_DEBUG: debug
  BLUEALSA_LOG_LEVEL: debug
  SANITIZE_MEMORY_LIBS: ${{ github.workspace }}/sanitize-memory-libs
  SANITIZE_THREAD_LIBS: ${{ github.workspace }}/sanitize-thread-libs

jobs:

  check:
    strategy:
      matrix:
        features:
        - --enable-debug
        - --enable-debug --enable-aac --enable-msbc --enable-lc3-swb
        - --enable-debug --enable-mp3lame --enable-mpg123 --enable-upower
        - --enable-faststream --enable-midi --enable-mp3lame
        - --enable-aplay --with-libsamplerate --enable-ofono --enable-opus
        - --disable-aplay --enable-asha --enable-rfcomm --enable-manpages
        - --disable-ctl --enable-aptx --enable-aptx-hd --with-libopenaptx
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install Dependencies
      uses: ./.github/actions/apt-install-deps
    - name: Create Build Environment
      run: |
        mkdir -p ${{ github.workspace }}/{build,m4}
        autoreconf --install
    - name: Configure GNU Automake
      working-directory: ${{ github.workspace }}/build
      run: |
        ${{ github.workspace }}/configure \
          ${{ matrix.features }} \
          --enable-test
    - name: Build
      working-directory: ${{ github.workspace }}/build
      run: make check CFLAGS="-Wall -Wextra -Werror -Wshadow" TESTS=
    - name: Run Tests
      working-directory: ${{ github.workspace }}/build/test
      run: make check-TESTS
    - name: Show Test Status
      if: ${{ always() }}
      run: cat ${{ github.workspace }}/build/test/test-suite.log
    - name: Upload Tests Log
      uses: actions/upload-artifact@v7
      if: ${{ always() }}
      with:
        name: ${{ github.job }} (${{ matrix.features }}) logs
        path: ${{ github.workspace }}/build/test/*.log

  sanitize-prepare:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/cache@v6
      id: cache
      with:
        key: ${{ runner.os }}-${{ runner.arch }}-sanitize-env
        path: |
          ${{ env.SANITIZE_MEMORY_LIBS }}
          ${{ env.SANITIZE_THREAD_LIBS }}
    - name: Create Build Environment
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        sudo apt install --yes --quiet --no-install-recommends \
          autoconf-archive libgmp-dev libmpc-dev libmpfr-dev meson
        mkdir -p ${{ env.SANITIZE_MEMORY_LIBS }}
        mkdir -p ${{ env.SANITIZE_THREAD_LIBS }}
    - name: Compile Patched GCC Thread Sanitizer Library
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        git clone --depth=1 --branch=releases/gcc-15.2.0 https://github.com/gcc-mirror/gcc.git
        # GCC (and Clang) skips interception in case when the call is made while the
        # thread is waiting on a blocking system call. In most cases this is a case
        # when the call is made from a signal handler. However, BlueALSA uses thread
        # cancellation to stop the thread, which operates in a similar way. Therefore,
        # we need to patch the thread sanitizer library to not skip the interception.
        sed -i 's/|| thr->ignore_interceptors//' gcc/libsanitizer/tsan/tsan_interceptors.h
        # Build patched thread sanitizer library
        mkdir -p gcc-build && cd gcc-build && ../gcc/configure --disable-multilib && cd -
        make -C gcc-build all-build-fixincludes
        make -C gcc-build all-stage1-gcc
        make -C gcc-build all-stage1-target-libstdc++-v3
        make -C gcc-build all-target-libsanitizer
        mv gcc-build/x86_64-pc-linux-gnu/libsanitizer/tsan/.libs/libtsan.so* ${{ env.SANITIZE_THREAD_LIBS }}
    - name: Compile dbus-1
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        git clone --depth=1 --branch=dbus-1.16.2 https://gitlab.freedesktop.org/dbus/dbus.git
        # Build dbus-1 with preserved frame pointers
        CFLAGS="-g -O2 -fno-omit-frame-pointer" \
          cmake -S dbus -B dbus/build-memory -DCMAKE_INSTALL_PREFIX=/usr -DDBUS_BUILD_TESTS=OFF -DDBUS_ENABLE_STATS=ON
        cmake --build dbus/build-memory
        mv dbus/build-memory/lib/libdbus-1.so* ${{ env.SANITIZE_MEMORY_LIBS }}
        # Build dbus-1 with thread sanitizer
        CFLAGS="-g -O2 -fno-omit-frame-pointer -fsanitize=thread" \
          cmake -S dbus -B dbus/build-thread -DCMAKE_INSTALL_PREFIX=/usr -DDBUS_BUILD_TESTS=OFF -DDBUS_ENABLE_STATS=ON
        cmake --build dbus/build-thread
        mv dbus/build-thread/lib/libdbus-1.so* ${{ env.SANITIZE_THREAD_LIBS }}
    - name: Compile glib-2.0
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        git clone --depth=1 --branch=2.88.0 https://github.com/GNOME/glib.git
        # Build glib with preserved frame pointers
        CFLAGS="-g -O2 -fno-omit-frame-pointer" \
          meson setup glib/build-memory glib -Dtests=false
        DESTDIR=../build-image ninja -C glib/build-memory install
        mv glib/build-image/usr/local/lib/x86_64-linux-gnu/lib* ${{ env.SANITIZE_MEMORY_LIBS }}
        # Build glib with thread sanitizer
        CFLAGS="-g -O2 -fno-omit-frame-pointer" \
          meson setup glib/build-thread glib -Dtests=false -Db_sanitize=thread
        DESTDIR=../build-image ninja -C glib/build-thread install
        mv glib/build-image/usr/local/lib/x86_64-linux-gnu/lib* ${{ env.SANITIZE_THREAD_LIBS }}

  sanitize:
    strategy:
      matrix:
        sanitize:
        - address alignment bool bounds nonnull-attribute shift undefined
        - thread
      fail-fast: false
    needs: sanitize-prepare
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v7
    - name: Install Dependencies
      uses: ./.github/actions/apt-install-deps
    - name: Create Build Environment
      run: |
        mkdir -p ${{ github.workspace }}/{build,m4}
        autoreconf --install
    - name: Configure GNU Automake
      working-directory: ${{ github.workspace }}/build
      run: |
        ${{ github.workspace }}/configure \
          --enable-aac \
          --enable-aptx \
          --enable-aptx-hd \
          --with-libopenaptx \
          --enable-asha \
          --enable-faststream \
          --enable-lc3-swb \
          --enable-midi \
          --enable-mp3lame \
          --enable-mpg123 \
          --enable-msbc \
          --enable-ofono \
          --enable-opus \
          --enable-upower \
          --enable-aplay \
          --with-libsamplerate \
          --enable-ctl \
          --enable-test
    - name: Build
      working-directory: ${{ github.workspace }}/build
      run: |
        make clean
        SANITIZERS=$(for x in ${{ matrix.sanitize }}; do echo -n " -fsanitize=$x"; done)
        make check CFLAGS="-g -O2 $SANITIZERS -fno-omit-frame-pointer -fno-sanitize-recover=all" TESTS=
    - uses: actions/cache/restore@v6
      with:
        key: ${{ runner.os }}-${{ runner.arch }}-sanitize-env
        path: |
          ${{ env.SANITIZE_MEMORY_LIBS }}
          ${{ env.SANITIZE_THREAD_LIBS }}
    - name: Run Tests
      working-directory: ${{ github.workspace }}/build
      env:
        CK_TIMEOUT_MULTIPLIER: 5
        ASAN_OPTIONS: detect_stack_use_after_return=1
        LSAN_OPTIONS: suppressions=${{ github.workspace }}/.github/sanitize-lsan.supp
        TSAN_OPTIONS: suppressions=${{ github.workspace }}/.github/sanitize-tsan.supp atexit_sleep_ms=0
      run: |
        case "${{ matrix.sanitize }}" in
          *address*)
            export LD_LIBRARY_PATH="${{ env.SANITIZE_MEMORY_LIBS }}:$LD_LIBRARY_PATH"
            export LD_PRELOAD_SANITIZER="libasan.so.8" ;;
          *thread*)
            export LD_LIBRARY_PATH="${{ env.SANITIZE_THREAD_LIBS }}:$LD_LIBRARY_PATH"
            export LD_PRELOAD_SANITIZER="libtsan.so.2" ;;
        esac
        make -C test check-TESTS
    - name: Show Test Status
      if: ${{ always() }}
      run: cat ${{ github.workspace }}/build/test/test-suite.log
    - name: Upload Tests Log
      uses: actions/upload-artifact@v7
      if: ${{ always() }}
      with:
        name: ${{ github.job }} (${{ matrix.sanitize }}) logs
        path: ${{ github.workspace }}/build/test/*.log
