name: Install Dependencies
runs:
  using: composite
  steps:
    - name: Install DEB Packages
      uses: awalsh128/cache-apt-pkgs-action@v1
      with:
        packages: >
          bear
          check
          iwyu
          jq
          lcov
          libasound2-dev
          libbluetooth-dev
          libbsd-dev
          libdbus-1-dev
          libfdk-aac-dev
          libglib2.0-dev
          liblc3-dev
          libmp3lame-dev
          libmpg123-dev
          libncurses5-dev
          libopenaptx-dev
          libopus-dev
          libreadline-dev
          libsamplerate0-dev
          libsbc-dev
          libspandsp-dev
          python3-docutils
